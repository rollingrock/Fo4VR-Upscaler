# BlurAway VR settings.
#
# This file ships with the mod. Changes made in the in-headset panel are saved to
# Documents/My Games/Fallout4VR/F4SE/Fo4VRUpscalerOverride.toml instead. That file wins
# per key and survives mod updates; delete it to return to the values below.
#
# Both files are re-read each time a save loads. A missing key keeps its default. A value
# the mod refuses is named in Fo4VRUpscaler.log, with the reason.
#
# [Fo4VRUpscaler] holds the settings for play. [Diagnostics] is for troubleshooting:
# leave it at its defaults, except logLevel.

[Fo4VRUpscaler]

# Deprecated; use mode = "off" instead. enabled = false also stops the hooks from being
# installed, which mode cannot do. Restart to change.
# enabled = true

# "off", "dlaa" (full resolution), or a reduced mode: "quality", "balanced",
# "performance" or "ultraperformance". Moving between dlaa and a reduced mode needs a
# restart, as does a reduced mode in a session that started in off.
mode = "dlaa"

# true: a recoverable fault pauses DLSS and retries, up to 8 times a session.
# false: the first fault turns DLSS off for the rest of the session.
failSoft = true

# Hotkey that switches between "off" and this session's mode. Hotkeys are Win32
# virtual-key codes (106 is keypad *), 0 unbinds one, and they work only while the game
# window has focus and the console is closed.
hotkeyToggleVk = 106

# Hotkey that shows the native image while held. 111 is keypad /.
hotkeyCompareVk = 111

# The in-headset panel: a SteamVR overlay, or under OpenComposite the mod's own OpenXR
# layer, which binds 15 controller profiles. false removes the panel and unbinds
# hotkeyPanelVk. Under OpenComposite, restart after turning this on.
panelEnabled = true

# Hotkey that shows and hides the panel. 122 is F11.
hotkeyPanelVk = 122

# Panel width in metres, 0.2 to 2.0. Applies the next time the panel is created.
panelWidthMeters = 0.6

# "room" leaves the panel where it opened; "head" makes it follow your head.
panelAnchor = "room"

# How far ahead of your eyes the panel opens, in metres, 0.3 to 3.0.
panelDistanceMeters = 1.0

# ---------------------------------------------------------------------------
# Advanced. Leave the keys below at their defaults unless a fix calls for a change.
# These need a restart: enabled, backend and forceHiddenAreaMeshOff in this table, and
# workshopMaskHooks, devBench, diagnosticDynamicResolution and
# diagnosticContinuousFrames in [Diagnostics]. Everything else applies without one.
# ---------------------------------------------------------------------------

# "auto" (means "ngx", NVIDIA DLSS), "ngx", "streamline", "ffx" or "null". Only auto and
# ngx can run a reduced mode; with the others it falls back to dlaa. Restart to change.
backend = "auto"

# Folder that nvngx_dlss.dll, NVIDIA's DLSS runtime, is loaded from. The mod ships the
# runtime in this folder. The log names the path and version in use.
runtimeDir = "Data/F4SE/Plugins/Fo4VRUpscaler"

# DLSS preset for every mode: "auto" or one letter. K is sharper than F and costs more
# GPU time.
preset = "K"

# Sharpening after DLSS, 0.0 to 1.0. 0 turns it off.
sharpness = 0.5

# Deprecated: mode replaces it.
# quality = "dlaa"

# 0 uses the mode's own render ratio. 0.30 to just under 1.00 sets a custom ratio for a
# reduced mode; set mode = "dlaa" for full resolution.
renderScaleOverride = 0.0

# Texture mip bias. 999 derives it from the render ratio; -8 to 8 sets it directly.
mipBiasOverride = 999.0

# true also biases the trilinear samplers, which full-screen passes share.
mipBiasIncludeTrilinear = false

# true lowers each sampler's MinLOD so the full bias applies, which gives up the game's
# own texture degrade at distance.
mipBiasLowerMinLod = false

# "subrect" runs DLSS on each eye in place; "intermediates" copies each eye out first.
stereoMode = "subrect"

# Which half of the frame is the left eye: "auto", "LR" or "RL". auto is right for 1.2.72.
eyeOrder = "auto"

# Reserved; does nothing yet.
jitterSource = "engine"

# Reserved; does nothing yet. DLSS sets the jitter sequence length.
jitterPhaseOverride = 0

# Reserved; does nothing yet.
reactiveMask = true

# Reserved; does nothing yet.
excludePipboy = true

# Reserved; does nothing yet.
forceRadialDensityMaskOff = true

# Turns off the headset's hidden-area mesh so reduced modes get complete eyes. false makes
# reduced modes decline instead. Restart to change.
forceHiddenAreaMeshOff = true

# Experimental and unfinished.
unbindDepthStencil = false

# Reset the DLSS history in both eyes when a menu opens or closes.
resetOnMenu = true

# Reset the DLSS history after a save loads.
resetOnLoad = true

# Reset the DLSS history on entering a different cell. Reduced modes keep it across
# exterior cell crossings they can prove are continuous.
resetOnCell = true

# Reset the DLSS history when a True Scopes scope is raised or lowered. Needs True Scopes
# 0.3.28 or later.
resetOnScope = true

# Skip DLSS while True Scopes renders its scope view.
suppressDuringScopeRender = true

# ---------------------------------------------------------------------------
# For troubleshooting. Leave everything here at its default, except logLevel.
# Turning on any developer test gate from diagnosticHdrRoundTrip to diagnosticTaaBypass
# forces mode to "off".
# ---------------------------------------------------------------------------

[Diagnostics]

# Test key for the reduced-mode HUD fix.
rebindDepthStencilAfterSeam = false

# Test key for the reduced-mode HUD fix. resolveDepthAfterSeam already does this.
clearStencilAfterSeam = false

# Reduced-mode HUD fix: stops scene geometry cutting off the compass. false is for
# comparison only.
resolveDepthAfterSeam = true

# Reduced-mode workshop outline fix. The hooks need a restart; the correction can be
# switched live while they are installed.
workshopMaskHooks = true
workshopMaskCorrection = true

# Reduced-mode reflection fix, for the cubemap shaders of the game's composite pass.
compositeReconstructionScale = true

# The same fix for the composite pass's other shaders. Needs compositeReconstructionScale.
technique65600ReconstructionScale = true

# Records extra evidence about the reflection fix in the log.
compositeCorrectionDiagnostics = false

# 0 off, 1 warnings and errors, 2 info, 3 trace. Use 3 for a detailed bug report, then
# go back to 2; it costs performance.
logLevel = 2

# Registers developer tools with the devbench host, if it is present. Restart to change.
devBench = false

# Developer test setting for the reduced-resolution path. Restart to change.
diagnosticDynamicResolution = false

# Developer test gate.
diagnosticHdrRoundTrip = false

# Developer test gate.
diagnosticStereoNull = false

# Developer test gate.
diagnosticNgxCreate = false

# Developer test gate.
diagnosticNgxEvaluate = false

# Developer test gate.
diagnosticNgxReassemble = false

# Developer test gate.
diagnosticNgxHandback = false

# Developer test gate.
diagnosticNgxContinuous = false

# Developer test gate. Needs a build with FSR.
diagnosticFfxEvaluate = false

# Developer test gate. Needs a build with FSR.
diagnosticFfxReassemble = false

# Developer test gate. Needs a build with FSR.
diagnosticFfxHandback = false

# Developer test gate. Needs a build with FSR.
diagnosticFfxContinuous = false

# How many frames the continuous test gates run. Restart to change.
diagnosticContinuousFrames = 512

# Developer test gate.
diagnosticTaaReplacement = false

# Developer test gate.
diagnosticTaaBypass = false

# Logs the mod's per-stage CPU and GPU timings, at a small cost. The panel's timers
# checkbox switches the same key.
perfTimers = false

# Reserved; does nothing yet.
debugVisualise = ""

# Developer key. Keep 1; -1 reproduces a known jitter-sign artefact for testing.
jitterVendorSign = 1
