# Fo4VRUpscaler configuration.
#
# Lives at Data/F4SE/Plugins/Fo4VRUpscaler.toml, next to the DLL, and is read
# relative to the game's working directory - so under MO2 the virtual copy in
# your mod folder is the one that wins.
#
# Re-read at plugin load, on every game load, and on request from the dev
# tooling. A missing key keeps the in-code default; an unknown key is named in
# the log rather than silently ignored; a key with the wrong type is named and
# the default kept. Nothing here can crash the game, and a value the plugin
# refuses says so in the log with the reason.
#
# What this build does: it loads, writes an environment report to
# Documents/My Games/Fallout4VR/F4SE/Fo4VRUpscaler.log, answers the dev tools,
# resolves the verified stereo rectangle geometry, and installs fail-soft render
# probes. On the first verified primary render-thread call it creates one private D3D11
# context-state object but does not activate it. The default configuration changes not
# one pixel. The explicitly named diagnostics below can perform bounded byte-preserving
# copy tests; most other keys below the marker remain staged.

[Fo4VRUpscaler]

# Master switch. false = no hooks are installed and nothing is patched. The
# self-check, the settings routes and the dev tooling stay live, so a disabled
# install still writes a diagnosable log. Read once at load; restart to change.
enabled = true

# 0 = off, 1 = warnings and worse, 2 = info, 3 = trace. Level 3 logs every frame
# decision and is a measurable cost; it exists so a bug report can carry a trace
# instead of a guess. The startup banner is written before this is parsed, so it
# always appears.
logLevel = 2

# Register the plugin's tools into the devbench host when it is present. When it
# is absent this is a no-op and the log says so in one line - the dev tooling is
# never a load-order requirement.
devBench = true

# Staged policy key for normal activation. The current bounded diagnostics always
# session-disable on their first fault; false is parsed and reported but does not
# re-arm them. Never ship false when this policy is connected.
failSoft = true

# DEVELOPMENT ONLY and startup-only. true writes renderScaleOverride into the engine's
# byte-verified live and target dynamic-resolution width/height ratios before world
# rendering, then immediately reads all four back. Raw NGX reconstruction consumes the
# two eyes packed inside that reduced full-width viewport and writes full-sized outputs.
# After each accepted handback, Bethesda's slot-21 effect still performs its required
# source/destination routing at temporary unity scale, avoiding a second upscale. A
# world load that replaces the live ratios skips one vendor frame and reasserts the
# complete requested four-float contract after slot 21. The selected backend's own jitter
# sequence replaces the native eight-phase one in the main world for as long as it has live
# views. Restart to change the diagnostic policy.
# renderScaleOverride=0 uses the documented default ratio for the chosen quality mode.
# Requires a non-DLAA quality. false writes nothing.
diagnosticDynamicResolution = false

# DEVELOPMENT ONLY. false in the shipped configuration. true performs exactly 512
# pre-HDR logical-1 -> private -> logical-1 CopyResource round trips under exact
# D3D11.1 state isolation, then stops itself. No shader, scaling or conversion runs;
# vanilla HDR still executes 1 -> 3. Any inconsistent descriptor, thread, device,
# context-state operation or device-removal result disables it for the session.
# Live-reloadable and reported in /state.
diagnosticHdrRoundTrip = false

# DEVELOPMENT ONLY. false in the shipped configuration. true exercises the shipping
# stereo path for exactly 512 successful frames: split logical target 1 and the
# measured unjittered motion target into two zero-origin eyes; reference each eye's
# exact rectangle in logical DS1's standard-Z depth plane; call NullBackend
# independently; reassemble a private double-wide target; then copy identical colour
# back before vanilla HDR. The native eight-phase jitter is converted to render-pixel
# camera offsets once and supplied identically to both eyes. Exposure is an explicit
# backend-auto contract with a null texture and exact 1/1 pre-exposure scalars. Mutually
# exclusive with diagnosticHdrRoundTrip. Sharpening and temporal history stay absent.
diagnosticStereoNull = false

# DEVELOPMENT ONLY. false in the shipped configuration. true performs exactly one
# create-only raw NGX gate on FO4VR's real D3D11 device. It waits for valid color/motion
# descriptors at the verified primary ClearColor seam so vendor initialization completes
# before the first world-load HDR frame, with that HDR seam retained as a fallback. It
# allocates the two per-eye color/raw-motion/camera-completed-motion/output sets, initializes nvngx_dlss.dll from
# runtimeDir, and creates two independent configured-quality histories under exact D3D11.1 state
# isolation. It does not extract, evaluate, reassemble or copy a frame, so vanilla HDR
# receives untouched color.
# Requires backend="ngx" and is mutually exclusive with both diagnostics above.
diagnosticNgxCreate = false

# DEVELOPMENT ONLY. false in the shipped configuration. true performs exactly one
# configured-quality two-eye evaluation after explicit raw-NGX preparation. Native
# inputs use full eye extents; reconstruction inputs use packed reduced eye regions.
# Color and motion are extracted into private zero-origin eye textures; invalid holes are
# completed from guarded per-eye camera matrices and logical DS1. Both vendor outputs
# remain private: there is no reassembly and
# no copy into logical color 1, so vanilla HDR still receives the untouched engine frame.
# Requires backend="ngx" and is mutually exclusive with every diagnostic above.
diagnosticNgxEvaluate = false

# DEVELOPMENT ONLY. false in the shipped configuration. true performs exactly one
# configured-quality two-eye evaluation and reassembles both vendor outputs into a private
# descriptor-matched double-wide texture. It still makes no copy into logical color 1,
# so vanilla HDR receives the untouched engine frame. Requires backend="ngx" and is
# mutually exclusive with every diagnostic above.
diagnosticNgxReassemble = false

# DEVELOPMENT ONLY. false in the shipped configuration. true performs exactly one
# configured-quality two-eye evaluation, reassembles both vendor outputs into the private
# descriptor-matched double-wide texture, then copies it into logical color 1 before
# vanilla HDR. This is deliberately pixel-changing. Requires backend="ngx" and is
# mutually exclusive with every diagnostic above.
diagnosticNgxHandback = false

# DEVELOPMENT ONLY. false in the shipped configuration. true evaluates and
# reassembles 16 consecutive configured-quality raw-NGX frames into the private double-wide resource
# without changing engine color, preserving both histories across that warm-up. It then
# copies exactly diagnosticContinuousFrames consecutive accepted frames into logical
# color 1 before vanilla HDR.
# A failure before handback disables the gate for the session and leaves engine colour
# untouched; a health failure detected after a completed copy cannot undo that copy.
# Requires backend="ngx" and is mutually exclusive with every diagnostic above.
diagnosticNgxContinuous = false

# DEVELOPMENT ONLY. false in the shipped configuration. true evaluates exactly one
# two-eye native-AA frame through the pinned FSR 3.1 D3D11 backend. The gate extracts
# colour, completes motion, and converts each eye's depth into private zero-origin
# resources. Both FSR outputs remain private: no reassembly and no engine-colour copy
# are reachable. Backend histories and intermediates are torn down on the next HDR
# frame. Requires backend="ffx", an FFX-enabled build, and is mutually exclusive with
# every diagnostic above.
diagnosticFfxEvaluate = false

# DEVELOPMENT ONLY. false in the shipped configuration. true evaluates exactly one
# two-eye native-AA frame through FSR and reassembles the two zero-origin outputs into
# the private descriptor-matched double-wide texture. It never copies that texture into
# engine colour; vanilla HDR still receives the untouched frame. Backend histories,
# intermediates and the private target are torn down on the next HDR frame. Requires
# backend="ffx", an FFX-enabled build, and is mutually exclusive with every diagnostic
# above.
diagnosticFfxReassemble = false

# DEVELOPMENT ONLY. false in the shipped configuration. true evaluates and reassembles
# exactly one two-eye native-AA FSR frame, then performs one descriptor-matched copy from
# the private double-wide texture into logical engine colour 1 before vanilla HDR. Backend
# histories, intermediates and the private target are torn down on the next HDR frame.
# Requires backend="ffx", an FFX-enabled build, and is mutually exclusive with every
# diagnostic above.
diagnosticFfxHandback = false

# DEVELOPMENT ONLY. false in the shipped configuration. true evaluates and reassembles
# 16 consecutive native-AA FSR frames into the private double-wide resource without
# changing engine colour, preserving both per-eye histories across that warm-up. It then
# copies exactly diagnosticContinuousFrames consecutive accepted frames into logical
# colour 1 before vanilla HDR.
# A failure before handback disables the gate for the session and leaves engine colour
# untouched; a health failure detected after a completed copy cannot undo that copy.
# Safe-release-checked teardown begins on the next eligible HDR frame after completion and
# retries once if GPU release is deferred. Requires backend="ffx", an FFX-enabled build,
# and is mutually exclusive with every diagnostic above.
diagnosticFfxContinuous = false

# DEVELOPMENT ONLY. Accepted handback-frame limit shared by either continuous vendor
# gate and its coupled native-TAA replacement/bypass. 512 is the accepted regression
# window. Larger values enable bounded unattended soaks; valid range 1..216000.
# Set before launch. This does not turn the diagnostic into a normal shipping path.
diagnosticContinuousFrames = 512

# DEVELOPMENT ONLY. false in the shipped configuration. true overwrites exactly
# diagnosticContinuousFrames native TemporalAA results with a private full-screen pixel
# pass after Bethesda's draw.
# Native TAA still incurs its cost in this diagnostic. The private pass reads post-tonemap
# logical color 3 and writes the same format-converted value to both the active history
# target 61/62 and compositor target 4, preserving Bethesda's surrounding pass cleanup.
# Alone it runs on every TAA frame. Together with diagnosticNgxContinuous or
# diagnosticFfxContinuous it snapshots that source's accepted baseline and runs only on
# baseline + 1 followed by consecutive source-tagged healthy handbacks. Any binding,
# descriptor, shader, isolation or device-health mismatch leaves native TAA untouched.
diagnosticTaaReplacement = false

# DEVELOPMENT ONLY. false in the shipped configuration. true replaces exactly
# diagnosticContinuousFrames Bethesda prepared TAA draws rather than running after them.
# The gate resolves the
# engine's live history parity from a verified instruction, requires its selected
# 61/62 target to match, then reads logical color 3 and writes the expected history
# plus compositor target 4 under exact D3D11.1 state isolation. Any failure before
# the private Draw runs falls back to vanilla for that frame. Alone it runs on every
# TAA frame; with diagnosticNgxContinuous or diagnosticFfxContinuous it aligns to that
# source's configured consecutive accepted handbacks. Mutually exclusive with
# diagnosticTaaReplacement and every diagnostic except either continuous gate.
diagnosticTaaBypass = false

# ---------------------------------------------------------------------------
# Everything below this line is parsed, range-checked, live-reloadable and
# reported by the dev tooling. eyeOrder and all named diagnostics are honoured now;
# the remaining staged keys name the measurement that switches each one on.
# ---------------------------------------------------------------------------

# --- backend selection ---

# "auto" / "ngx" / "streamline" / "ffx" / "null". auto probes in that order and
# takes the first that reports itself available; the log names every backend and
# why each was or was not chosen. "null" is the passthrough control arm - it
# installs the hooks and evaluates nothing, so an A/B against it measures our
# own overhead rather than the reconstruction.
# Inert until: a backend has something to evaluate.
backend = "auto"

# Where the mod looks for vendor runtime DLLs. They are user-supplied and loaded
# by explicit path, never by search order, so a stray copy elsewhere on PATH
# cannot quietly win a bug report. The resolved path and the version the runtime
# actually reported are both logged.
# Inert until: a backend is selected.
runtimeDir = "Data/F4SE/Plugins/Fo4VRUpscaler"

# Reconstruction preset. Raw NGX accepts "auto" or one letter, case-insensitive.
# "auto" supplies the SDK default sentinel so the runtime and its driver profile decide;
# the log names both the request and the parameter value reported after creation. Preset
# overrides forced by a driver profile are the largest source of contradictory
# folklore in this ecosystem. Deliberately a free string and not a fixed list:
# preset letters have been added, deprecated and removed inside eighteen months,
# and a compile-time list is how an integration gets stuck a preset behind.
# "auto" resolves today to K for dlaa, balanced and quality, M for performance and L for
# ultraperformance, and NVIDIA may change those defaults in a driver update without any
# change here. The log line after feature creation reports the value the runtime actually
# resolved, which is how such a change becomes visible.
# Inert until: a backend is selected.
preset = "auto"

# 0..1. Our own RCAS sharpen at the TemporalAA seam, applied to the submitted target on
# every frame this plugin draws (DLAA and the reduced modes alike). The engine's own
# TemporalAA sharpens its output and the seam draw would otherwise drop that term, which
# through the lenses showed as native looking sharper than the reconstruction - an
# observation, not a measurement. Mapped to RCAS stops as 2 * (1 - sharpness): 1.0 is
# the kernel's maximum, 0.5 one stop down. 0 is off and bit-identical to no pass at all -
# the unsharpened shader stays bound. Never handed to a vendor runtime: raw NGX's own
# sharpen is deprecated and is forced to zero regardless. Sharpening after temporal
# reconstruction amplifies whatever the reconstruction got wrong; raise it last, not
# first. The default is an owner decision for the Phase 4 buttons, not a measurement.
sharpness = 0.5

# --- quality and resolution ---

# "dlaa" (native anti-aliasing, ratio 1.0) / "quality" / "balanced" /
# "performance" / "ultraperformance".
#
# dlaa is the honest default and it is the expensive one. It feeds four times
# the input pixels of the numbers most published benchmarks were measured at and
# has no mechanism to give frames back - it buys clarity, not framerate. If your
# frame time goes over budget the fix is to drop the headset or runtime
# resolution, not to lower this, because native anti-aliasing at a reduced
# output is strictly worse than a reconstruction mode at full output.
# Raw-NGX diagnostics honour this. A non-DLAA mode additionally requires
# diagnosticDynamicResolution and a valid reduced renderScaleOverride at startup.
quality = "dlaa"

# 0 = use the documented default ratio for the chosen quality mode - 0.6667, 0.5800,
# 0.5000 and 0.3333 for quality, balanced, performance and ultraperformance respectively,
# which is what each mode's training assumed - and then snap it, once the per-eye output
# extent is known, to whatever ratio makes the engine land on the vendor's own optimal
# render size. The plugin floors width times ratio when it configures the vendor, so the
# unsnapped default misses that size by a pixel: 1852 by 0.6667 gives 1234 where the
# runtime asks for 1235. Any value in 0.30..1.00 overrides it and is written verbatim with
# no snap, for measurement rather than tuning. Honoured at startup only when
# diagnosticDynamicResolution is true, and dlaa is left alone because its ratio is 1.0 and
# it is not a reduced mode - a dlaa session takes the native seams instead. The engine's
# ratio is restart-only, so if the runtime's optimal size still disagrees after the snap
# the log says so and the session keeps running at the value it has.
renderScaleOverride = 0.0

# 999 = derive the texture mip bias from the configured per-eye render and output
# widths using the backend's own formula (they differ between vendors), plus the
# engine's own native bias, which is a measured 0.0. Any value in -8..8 is used
# verbatim, and 0.0 is a legitimate value, which is why the sentinel is not 0.
# The derived bias is what keeps textures sharp at reduced resolution, but vendor
# guidance warns it can produce flicker and moire - this is the escape hatch, and
# the band worth sweeping is log2(render/output)-1 up to log2(render/output). A
# value outside that band is honoured and logged, never clamped.
# A dlaa session is biased too - the vendor formula keeps its -1 term at ratio 1.0 - but
# through the native one-to-one seams rather than the reduced-world bracket: applied at
# the pre-world screen-geometry update, restored at the late ImageSpace range.
mipBiasOverride = 999.0

# false = bias only the anisotropic sampler class, which is the world material
# class. true also biases the trilinear class, which the engine shares between
# world material sampling and full-screen linear sampling, so a full-screen pass
# would start sampling its source one mip level sharper than it was written. Turn
# it on only if the sampler probe shows world geometry binding the trilinear
# class.
mipBiasIncludeTrilinear = false

# false = leave every sampler's MinLOD alone. FO4 sets MinLOD to the sampler's own
# mip index, which is exactly the global mip-bias clamp vendor guidance tells
# integrators to disable - with it in place a negative bias reaches nothing on 15
# of every 16 entries. It is also the engine's texture-degrade mechanism
# (iTextureDegradeDistance0/1), so true trades that mechanism for the full bias
# and is off by default rather than because the clamp is harmless.
mipBiasLowerMinLod = false

# --- stereo ---

# "subrect" reconstructs each eye in place against the double-wide targets using
# per-resource sub-rectangle bases: no colour copy in, no output copy out, and
# the motion sanitizer reads the engine target directly. "intermediates" copies
# each eye into its own zero-origin staging texture first. subrect is the default
# because the NGX runtime honours the bases bit for bit on D3D11 when asked at
# creation (measured against the zero-origin path by tools/subrect-harness). On a
# backend that cannot address them - ffx, streamline, and the ngx stub of a build
# compiled without the NGX SDK, which is the default build - the plugin resolves
# to intermediates for the session and says so in the log, and /state reports
# both the requested and the effective mode. A change takes effect on reload and
# re-creates the backend views.
stereoMode = "subrect"

# "auto" / "LR" / "RL". Which half of the double-wide frame is the left eye.
# auto uses the left-first layout directly verified from FO4VR 1.2.72's shipping
# deferred shader bytecode and compositor submit bounds. The override remains a
# checkable recovery control and takes effect on reload.
eyeOrder = "auto"

# --- jitter ---

# "engine" reads the game's own projection translation and converts it to the
# render-pixel camera-jitter convention at the backend seam; "backend" will overwrite
# it with the sequence the backend was trained on, of the length the ratio requires.
#
# The read path is proven either way: per-eye divisors and both axis signs are
# byte-derived, range-checked and live-gated, and only the eight-phase sequence length is
# too short for reconstruction. The selected backend now owns the sequence whenever it has
# live views and the engine's jitter call site is patched - it writes its own sample into
# the same two floats, and the evaluation refuses any frame where the engine no longer
# holds that exact sample. Both spellings therefore describe the same read path, and
# neither selects between them.
# Inert until: there is a reason to run the shorter engine sequence deliberately.
jitterSource = "engine"

# 0 = use the vendor minimum for the ratio. Sequence length scales with the
# square of the upscale ratio, so a sequence tuned for one-to-one temporal
# anti-aliasing is far too short for reconstruction, and the symptom is shimmer
# rather than an error message.
# The armed count already comes from the selected backend's own formula - eight at dlaa,
# eighteen at quality - so a shorter or longer count is an experiment nothing needs.
# Inert until: an experiment needs a count the backend would not choose.
jitterPhaseOverride = 0

# --- masks and exclusions ---

# Build a per-pixel reactive mask so reticles, muzzle flash and particles are
# reconstructed as the transient things they are. This is the alternative to
# this ecosystem's current answer, which is to switch the upscaler off entirely
# while you are aiming.
# Inert until: the input colour range is known and the mask pass exists.
reactiveMask = true

# Skip reconstruction while the Pip-Boy or a 3D interface is up. Whether the
# engine's motion vectors stay valid across an open menu is one of the
# measurements this key waits on; reconstructing stale vectors smears text, and
# text is the one thing a Pip-Boy is for.
# Inert until: the interface render paths are identified.
excludePipboy = true

# The game's own radial density mask writes a checkerboard that a temporal
# reconstructor reads as real detail and smears across the periphery. Turning it
# off is a precondition, not a preference.
# Inert until: the setting's engine-side location is confirmed.
forceRadialDensityMaskOff = true

# Reduced rasterization leaves the headset's hidden-area regions unwritten, but
# reconstruction consumes a rectangular eye. False keeps the engine setting intact
# and makes reduced-input modes decline rather than publish incomplete pixels.
# Startup-only; restart after changing it.
forceHiddenAreaMeshOff = true

# Experimental raw-context depth-stencil bracket for prepared ImageSpace draws.
# Engine state commits may rebind the cached DSV before the draw, so this is disabled
# until a cache-native bracket has complete call-site coverage and draw-time proof.
unbindDepthStencil = false

# --- reset policy ---

# Reset both eye histories when a menu opens or closes. Both, always together:
# resetting one eye and not the other is a stereo-rivalry artifact, which is
# worse than the ghost it fixed.
resetOnMenu = true

# Reset after the F4SE game-loaded lifecycle edge.
resetOnLoad = true

# Reset when the player enters a different cell. This catches direct COC and
# worldspace transitions independently of menu timing.
resetOnCell = true

# Reset on a True Scopes scope-raise edge. The scope render is a second,
# mid-frame world render at a different field of view; the history from before
# it is not history of this view.
# Inert until: there is a history to reset.
resetOnScope = true

# --- compatibility and diagnostics ---

# Skip our evaluate entirely while True Scopes' own deferred resolve is on the
# stack. Conservative by design - the two mods share a render thread and a
# render-target set, and coexisting quietly is worth more than the frame we
# would save.
# Wired to Fallout4VR's own scoped-pass selector. A live True Scopes interaction
# pass remains required.
suppressDuringScopeRender = true

# Per-stage GPU timestamp queries plus CPU marks, reported by the dev tooling.
# Flip off then on to reset the accumulators for a clean measurement window.
# This is the only way to answer what this mod actually costs without a
# debugger, and the answer is the whole argument.
# Inert until: there are stages to time.
perfTimers = false

# "" / "mv" / "depth" / "jitter" / "reactive". Draws the named input over the
# frame, in the headset. Motion vectors are the input most likely to be wrong
# and the one nobody can check by looking at the final image.
# Inert until: the inputs are identified.
debugVisualise = ""
