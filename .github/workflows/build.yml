# Proves the tree builds green with -DUPSCALER_ENABLE_NGX=OFF on a machine with no
# vendor SDK present.
#
# That is the whole job. The release build links NVIDIA's NGX client library and needs
# its archive staged; the SDK-free build is the one anyone can perform - no vendor
# account, no staged runtime - and the claim runs through cmake/FindNgxSdk.cmake,
# docs/STYLE.md and the README. A claim that is only ever tested by hand on the author's
# machine is not evidence, so every configure below passes the OFF flag explicitly and
# the workflow stages nothing: no fetch-sdks.ps1 step, no .sdk-cache, and an explicit
# assertion that neither has appeared.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows Release, SDK-free (-DUPSCALER_ENABLE_NGX=OFF)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Assert no vendor SDK is present
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath '.sdk-cache') {
            throw '.sdk-cache exists in a clean checkout, so the no-SDK build proof is void.'
          }
          # The OpenXR menu layer's manifest is ours and tracked on purpose (.gitignore);
          # everything else under the runtime folder is user-supplied.
          $vendorDir = 'Data/F4SE/Plugins/Fo4VRUpscaler'
          $ours = @('.gitkeep', 'OpenXR/Fo4VRUpscalerOpenXR.json')
          if (Test-Path -LiteralPath $vendorDir) {
            $root = (Resolve-Path -LiteralPath $vendorDir).Path
            $stray = @(Get-ChildItem -LiteralPath $vendorDir -Recurse -File -Force |
              Where-Object { $ours -notcontains $_.FullName.Substring($root.Length + 1).Replace([IO.Path]::DirectorySeparatorChar, '/') })
            if ($stray.Count -gt 0) {
              throw "Vendor runtime files are tracked: $($stray.Name -join ', ')"
            }
          }
          Write-Host 'No vendor SDK staged. Building from source only.'

      - name: Resolve vcpkg root
        shell: pwsh
        run: |
          # CMakeLists.txt reads VCPKG_ROOT and the vcpkg preset reads
          # VCPKG_INSTALLATION_ROOT. The runner sets only the second.
          $root = $env:VCPKG_INSTALLATION_ROOT
          if (-not $root -or -not (Test-Path -LiteralPath (Join-Path $root 'scripts/buildsystems/vcpkg.cmake'))) {
            throw "No vcpkg toolchain found at '$root'."
          }
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $cache = Join-Path $env:GITHUB_WORKSPACE 'vcpkg-binary-cache'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      # The SDK-free preset, not the default one: its x64-windows-static-md triplet is the
      # one the openvr port builds under (openvr cannot link fully static).
      - name: Configure
        shell: pwsh
        run: cmake --preset vs2022-windows-vcpkg-vr-nongx -DUPSCALER_ENABLE_NGX=OFF

      - name: Build the plugin
        shell: pwsh
        run: cmake --build buildvr-nongx --config Release

      # The harness is the file that most depends on the no-SDK path compiling: with
      # nothing staged its whole body is the UPSCALER_NO_NGX branch, and that branch is
      # only reachable because the UPSCALER_* definitions are PUBLIC on upscaler_backends.
      - name: Configure with the standalone harness
        shell: pwsh
        run: cmake --preset vs2022-windows-vcpkg-vr-nongx -DUPSCALER_ENABLE_NGX=OFF -DBUILD_TOOLS=ON

      - name: Build the standalone harness
        shell: pwsh
        run: cmake --build buildvr-nongx --config Release --target subrect_harness

      - name: Run the standalone harness
        shell: pwsh
        run: ./buildvr-nongx/tools/Release/subrect_harness.exe

      - name: Assert the build staged nothing
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath '.sdk-cache') {
            throw 'The build created .sdk-cache. Nothing in the build may fetch a vendor SDK.'
          }

  lint:
    name: Format and vendor-binary check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: pipx install clang-format==19.1.5

      - name: Check formatting
        run: |
          # DevBenchAPI.{h,cpp} are vendored verbatim from upstream devbench. Reformatting
          # them would make every future diff against upstream unreadable.
          files=$(git ls-files -- src tools ':!src/DevBenchClient/DevBenchAPI.*' | grep -E '\.(cpp|h)$' || true)
          if [ -z "$files" ]; then
            echo "No C++ sources to check."
            exit 0
          fi
          clang-format --dry-run -Werror $files

      # The no-vendor-binary rule exists as prose in three documents. Here it is a gate.
      - name: No vendor binary is tracked
        run: |
          matches=$(git ls-files | grep -Ei '(^|/)(nvngx[^/]*\.dll|sl\.[^/]*\.dll|amd_fidelityfx_[^/]*\.dll|ffx_[^/]*\.dll|libxess[^/]*\.dll|nvsdk_ngx[^/]*\.(h|lib))$' || true)
          if [ -n "$matches" ]; then
            echo "Vendor binaries or SDK headers are tracked in this repository:" >&2
            echo "$matches" >&2
            exit 1
          fi
          echo "No vendor binary or SDK header is tracked."

      - name: PowerShell parse check
        shell: pwsh
        run: |
          $failed = 0
          foreach ($file in (git ls-files '*.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "Parse errors in ${file}:"
              foreach ($e in $errors) { Write-Host "  line $($e.Extent.StartLineNumber): $($e.Message)" }
              $failed = 1
            }
          }
          exit $failed
